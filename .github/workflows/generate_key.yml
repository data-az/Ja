# ВРЕМЕННЫЙ workflow. Запускать только в приватном репозитории.
# Создаёт ключ подписи, кладёт всё нужное в артефакт secrets.txt (живёт 1 день).
# После копирования значений в GitHub Secrets удалите артефакт и этот файл.
name: Generate signing key (temporary)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Создать ключ и подготовить секреты
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v \
            -keystore release.jks -storetype PKCS12 \
            -alias jarvis -keyalg RSA -keysize 4096 -validity 20000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=JARVIS AX, O=AX, C=RU"
          B64=$(base64 -w0 release.jks)
          SHA=$(keytool -exportcert -alias jarvis -keystore release.jks -storepass "$PASS" | sha256sum | cut -d' ' -f1)
          {
            echo "KEYSTORE_BASE64=$B64"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=jarvis"
            echo "KEY_PASSWORD=$PASS"
            echo "SHA256=$SHA"
          } > secrets.txt
          # Хеш не секрет: его можно показать в логе
          echo "SHA-256 сертификата (вставить в EXPECTED_SHA256): $SHA"
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-SECRET
          path: secrets.txt
          retention-days: 1
