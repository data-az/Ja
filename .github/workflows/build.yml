name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find . -maxdepth 1 -type f -name 'JARVIS*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: JARVIS*.zip not found in repository root."
            ls -la
            exit 1
          fi
          echo "Using ZIP: $ZIP"
          rm -rf project && mkdir -p project
          unzip -q "$ZIP" -d project
          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" -type f -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform 37 + build-tools
        shell: bash
        run: |
          set -eo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<not set>}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          for P in "platforms;android-37.0" "platforms;android-37"; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "$P"; then
              echo "Platform installed: $P"
              break
            fi
          done
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "build-tools;36.0.0"
          if ! "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list_installed | grep -q "platforms;android-37"; then
            echo "ERROR: platform android-37 не установлена. Доступные платформы:"
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list | grep 'platforms;' || true
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build CI APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleCi

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find "$PROJECT_DIR" -type f -path "*/build/outputs/apk/ci/*.apk" -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-CI-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
