name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unpack project
      run: |
        # Распаковываем ваш архив в папку project
        unzip JARVIS_4_9_Compose_Cloudy_Migration.zip -d project
        echo "Содержимое папки project:"
        ls -la project
    
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    # Явно указываем Gradle 9.8.2, который совместим с AGP 9.1
    - name: Setup Gradle 9.8.2
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.8.2'
    
    - name: Build with Gradle
      working-directory: ./project
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/app/build/outputs/apk/debug/app-debug.apk
