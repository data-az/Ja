
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "JARVIS_4_9_Compose_Cloudy_Migration.zip" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p project
          unzip -q JARVIS_4_9_Compose_Cloudy_Migration.zip -d project

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --update

          echo "Available Android platforms:"
          "$SDKMANAGER" --list | grep -E 'platforms;android-[0-9]+' || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"

          echo "Installed SDK packages:"
          "$SDKMANAGER" --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          echo "Building JARVIS..."
          gradle --version

          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT_DIR" -type d -name build -print
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-4.9-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
