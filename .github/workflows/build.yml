
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="JARVIS_4_9_Compose_Cloudy_Migration.zip"

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "::error::Не найден $ARCHIVE в корне репозитория."
            ls -la
            exit 1
          fi

          unzip -t "$ARCHIVE"

      - name: Unpack project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q "JARVIS_4_9_Compose_Cloudy_Migration.zip" -d project

          SETTINGS_FILE="$(find project -type f -name settings.gradle.kts -print -quit)"

          if [[ -z "$SETTINGS_FILE" ]]; then
            echo "::error::Не найден settings.gradle.kts."
            find project -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Корень проекта: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

          if [[ ! -f "$PROJECT_DIR/app/build.gradle.kts" && ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "::error::Не найден app/build.gradle."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit)"

          if [[ -z "$APK" ]]; then
            echo "::error::APK не найден после сборки."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk

          echo "APK успешно найден: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 14
