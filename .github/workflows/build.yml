
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="JARVIS_4_9_Compose_Cloudy_Migration.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "::error::Project ZIP not found!"
            ls -la
            exit 1
          fi

          unzip -t "$ARCHIVE"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q JARVIS_4_9_Compose_Cloudy_Migration.zip -d project

          SETTINGS=$(find project -name settings.gradle.kts -type f -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated"
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 14
